# Enable the GPIO (General Purpose Input/Output) subsystem
CONFIG_GPIO=y

# Enable the Console/UART for printk() messages
CONFIG_SERIAL=y

# Enable logging features
CONFIG_LOG=y

# Note: Do not set CONFIG_BOARD in prj.conf. Select the board at build time with
# `west build -b nucleo_f401re app/` or via your build system/CI.
